name: Validate Office HQ changes
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run tests
        working-directory: agent-office-hq
        run: npm test
      - name: Build public assets without secrets
        working-directory: agent-office-hq
        run: npm run build

  ios-safari-emulation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        working-directory: agent-office-hq
        run: npm install --no-audit --no-fund
      - name: Install Safari WebKit test engine and Linux dependencies
        working-directory: agent-office-hq
        run: npx playwright install --with-deps webkit
      - name: Exercise branch's static iPhone and iPad site (WebKit emulation)
        working-directory: agent-office-hq
        run: |
          npm run build
          python3 -m http.server 4173 --directory dist --bind 127.0.0.1 > /tmp/office-hq-static.log 2>&1 &
          STATIC_PID=$!
          trap 'kill $STATIC_PID 2>/dev/null || true' EXIT
          sleep 2
          OFFICE_HQ_SITE=http://127.0.0.1:4173/agent-office-hq/ node --test tests/ios-browser.e2e.mjs tests/ios-extension-webkit.e2e.mjs tests/ios-live-production.e2e.mjs tests/project-floor-webkit.e2e.mjs
