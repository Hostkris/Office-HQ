name: Validate Office HQ changes
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run tests
        working-directory: agent-office-hq
        run: npm test
      - name: Build public assets without secrets
        working-directory: agent-office-hq
        run: npm run build
