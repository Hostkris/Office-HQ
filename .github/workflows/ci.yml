name: Validate Office HQ changes
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run tests
        working-directory: agent-office-hq
        run: npm test
      - name: Build public assets without secrets
        working-directory: agent-office-hq
        run: npm run build

  ios-safari-emulation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependencies
        working-directory: agent-office-hq
        run: npm install --no-audit --no-fund
      - name: Install Safari WebKit test engine and Linux dependencies
        working-directory: agent-office-hq
        run: npx playwright install --with-deps webkit
      - name: Exercise iPhone and iPad browser UI (WebKit emulation)
        working-directory: agent-office-hq
        # Pull requests cannot deploy their own GitHub Pages build. Test the actual PR locally; verify the live site after deploy below.
        run: node --test tests/ios-browser.e2e.mjs tests/ios-extension-webkit.e2e.mjs tests/project-floor-webkit.e2e.mjs tests/website-access-webkit.e2e.mjs

