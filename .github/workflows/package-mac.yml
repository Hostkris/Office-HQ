name: Package Office HQ for Mac

on:
  push:
    branches: ["main"]
    paths:
      - "mac/**"
      - ".github/workflows/package-mac.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Office HQ
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build Mac ZIP from reviewed source
        run: python3 mac/build_download.py
      - name: Check downloadable Mac app structure
        run: |
          python3 - <<'PY'
          import zipfile
          p = 'downloads/Office_HQ_for_Mac.zip'
          with zipfile.ZipFile(p) as z:
              assert z.testzip() is None
              names = z.namelist()
              assert 'Office HQ.app/Contents/Resources/install.command' in names
              assert 'Office HQ.app/Contents/MacOS/OfficeHQ' in names
              for name in names:
                  if name.endswith('MacOS/OfficeHQ') or name.endswith('install.command'):
                      mode = (z.getinfo(name).external_attr >> 16) & 0o777
                      assert mode & 0o111, f'Not executable: {name}'
          print('Mac ZIP structure validated')
          PY
      - name: Publish ZIP to downloads on the existing main branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f downloads/Office_HQ_for_Mac.zip
          if git diff --cached --quiet; then
            echo 'Mac download already up to date.'
            exit 0
          fi
          git commit -m 'build(mac): publish downloadable Office HQ launcher ZIP [skip ci]'
          git push origin HEAD:main
