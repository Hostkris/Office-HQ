# Deploy the Agent Office HQ static web app from its actual source directory.
name: Deploy Agent Office HQ to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload the app itself as the website root
        uses: actions/upload-pages-artifact@v3
        with:
          path: './agent-office-hq'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
