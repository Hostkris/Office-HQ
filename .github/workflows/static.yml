# Validate the Node-powered source but publish static files only.
name: Deploy Agent Office HQ to GitHub Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify role boundaries, server and static site
        working-directory: agent-office-hq
        run: npm test
      - name: Build public-only website
        working-directory: agent-office-hq
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload safe static artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './agent-office-hq/dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke-test both published Office HQ URLs and CEO messages assets
        run: |
          set -euo pipefail
          for path in "" "agent-office-hq/" "agent-office-hq/ceo-secure-chat.js" "agent-office-hq/research-center.js"; do
            curl --fail --silent --show-error --location --retry 12 --retry-delay 5 --retry-all-errors "https://hostkris.github.io/Office-HQ/$path" --output /dev/null
          done
          echo "Root, iPhone legacy route and CEO message scripts are online."
