<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#101d29" />
  <meta name="description" content="Agent Office HQ: a multi-business AI workforce command center and animated virtual office." />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="icon.svg" />
  <link rel="stylesheet" href="styles.css" />
  <title>Agent Office HQ — Workforce Control Center</title>
</head>
<body>
  <div id="app" class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="Main navigation">
      <a class="brand" href="#/command" aria-label="Agent Office HQ home"><div class="brand-mark">▦<span>✦</span></div><div><strong>AGENT OFFICE</strong><small>HQ · Workforce OS</small></div></a>
      <div class="workspace-label">YOUR WORKSPACE</div>
      <div class="company-picker-wrap"><select id="companyPicker" aria-label="Choose company"></select><button id="addCompany" class="small-square" title="Add company" aria-label="Add company">＋</button></div>
      <div class="nav-label">OPERATIONS</div>
      <nav id="nav">
        <button data-view="command" class="nav-btn"><span class="nav-icon">◈</span> Command center</button>
        <button data-view="office" class="nav-btn"><span class="nav-icon">▦</span> Live RPG office <span class="nav-pill">LIVE</span></button>
        <button data-view="tasks" class="nav-btn"><span class="nav-icon">☷</span> Task board</button>
        <button data-view="workforce" class="nav-btn"><span class="nav-icon">♟</span> AI workforce</button>
        <button data-view="org" class="nav-btn"><span class="nav-icon">◇</span> Org & authority</button>
        <button data-view="approvals" class="nav-btn"><span class="nav-icon">✓</span> Approvals <span id="approvalNavCount" class="nav-count" hidden></span></button>
        <div class="nav-label">BUSINESS SYSTEMS</div>
        <button data-view="finance" class="nav-btn"><span class="nav-icon">＄</span> Finance & budget</button>
        <button data-view="inventory" class="nav-btn"><span class="nav-icon">▤</span> Inventory</button>
        <button data-view="audit" class="nav-btn"><span class="nav-icon">⌕</span> Audit trail</button>
        <button data-view="reports" class="nav-btn"><span class="nav-icon">▥</span> Reports & briefs</button>
        <div class="nav-label">SYSTEM</div>
        <button data-view="settings" class="nav-btn"><span class="nav-icon">⚙</span> Settings & connections</button>
      </nav>
      <div class="sidebar-bottom"><span class="connected-dot"></span><span id="modeLabel">Local workspace active</span><div class="side-foot">Your data stays on this device until connected.</div></div>
    </aside>
    <main class="main">
      <header class="topbar"><button id="menuToggle" class="icon-button mobile-menu" aria-label="Toggle navigation">☰</button><div class="breadcrumb" id="breadcrumb">WORKSPACE / COMMAND CENTER</div><div class="top-actions"><span id="liveClock" class="clock"></span><button id="helpButton" class="top-help" title="About this app">ⓘ Help</button><button class="avatar-you" id="userAvatar" title="Owner account">YOU</button></div></header>
      <div id="view" class="view" aria-live="polite"></div>
      <div id="toastArea" class="toast-area" aria-live="polite"></div>
    </main>
  </div>
  <div id="modalRoot"></div>
  <script src="app.js" defer></script>
</body>
</html>
